<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Compartment と Worker の隔離モデル</title>
  <desc id="desc">Compartment は同一 machine 内の軽量隔離、Worker は別 machine を使う隔離であることを示す図。</desc>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #153231; }
    .title { font-size: 26px; font-weight: 700; }
    .label { font-size: 19px; font-weight: 700; }
    .body { font-size: 15px; }
    .frame { fill: #f8fbfb; stroke: #295f5c; stroke-width: 2; rx: 18; ry: 18; }
    .inner { fill: #e8f4f3; stroke: #295f5c; stroke-width: 1.8; rx: 14; ry: 14; }
    .comp { fill: #edf8ec; stroke: #4a8159; stroke-width: 1.8; rx: 12; ry: 12; }
    .worker { fill: #fff3e0; stroke: #b97a14; stroke-width: 1.8; rx: 12; ry: 12; }
    .arrow { stroke: #295f5c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#295f5c" />
    </marker>
  </defs>
  <text x="42" y="52" class="title">隔離モデル: Compartment は軽く、Worker は重いが強い</text>

  <rect x="48" y="92" width="398" height="410" class="frame" />
  <text x="74" y="126" class="label">同じ machine の中</text>
  <rect x="76" y="156" width="342" height="110" class="inner" />
  <text x="96" y="192" class="label">共有されるもの</text>
  <text x="96" y="224" class="body">・ほとんどの built-ins</text>
  <text x="96" y="248" class="body">・slot / chunk heap</text>
  <text x="96" y="272" class="body">・同じ Promise job queue と host hooks</text>

  <rect x="76" y="304" width="152" height="152" class="comp" />
  <text x="98" y="338" class="label">Compartment A</text>
  <text x="98" y="370" class="body">別の `globalThis`</text>
  <text x="98" y="394" class="body">別の module map</text>
  <text x="98" y="418" class="body">capability 制御向き</text>

  <rect x="266" y="304" width="152" height="152" class="comp" />
  <text x="288" y="338" class="label">Compartment B</text>
  <text x="288" y="370" class="body">同じ machine に載る</text>
  <text x="288" y="394" class="body">資源は完全分離ではない</text>
  <text x="288" y="418" class="body">高速に作れる</text>

  <rect x="526" y="92" width="386" height="410" class="frame" />
  <text x="552" y="126" class="label">別 machine を作る</text>
  <rect x="554" y="156" width="154" height="156" class="worker" />
  <text x="576" y="190" class="label">Main machine</text>
  <text x="576" y="222" class="body">自身の stack / heap</text>
  <text x="576" y="246" class="body">host context</text>
  <text x="576" y="270" class="body">main module 群</text>

  <rect x="728" y="156" width="154" height="156" class="worker" />
  <text x="750" y="190" class="label">Worker machine</text>
  <text x="750" y="222" class="body">別の stack / heap</text>
  <text x="750" y="246" class="body">worker module</text>
  <text x="750" y="270" class="body">message queue</text>

  <path d="M 708 234 L 728 234" class="arrow" />
  <text x="602" y="348" class="body">通信は `postMessage` と XS Marshalling によるコピーが基本です。</text>
  <text x="602" y="378" class="body">資源予算は worker ごとに追加で必要になります。</text>
  <text x="602" y="408" class="body">RTOS や host によっては並列ではなく協調実行です。</text>
</svg>
